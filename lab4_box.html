<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Element</title>

    <style>
        div {
            float: left;
            padding: 10px;
        }

        .div1 {
            background: red;
        }

        .div2 {
            background: yellow;
        }

        .div3 {
            background: green;
        }

        .div4 {
            background-color: blue;
            clear: left;
            float: center;
            
        }
    </style>
</head>

<body>
    <header>
        <h1>Pembagian Wilayah</h1>
    </header>

    <section>
        <div class="div1">Wilayah 1</div>
        <div class="div2">Wilayah 2</div>
        <div class="div3">Wilayah 3</div>
        <div class="div4">Wilayah Inti</div>
    </section>
</body>

</html>
