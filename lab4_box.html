<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Element</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    header { margin-bottom: 20px; }
    section { display: flow-root; }
    div { float: left; padding: 10px; margin-right: 4px; color: #222; }
    .div1 { background: #f44336; }
    .div2 { background: #ffeb3b; }
    .div3 { background: #4caf50; }
    .div4 { background: #2196f3; clear: left; float: none; color: white; margin-top: 10px; }
  </style>
</head>
<body>
  <header><h1>Box Element</h1></header>
  <section aria-label="Contoh float dan clear">
    <div class="div1">Div 1</div>
    <div class="div2">Div 2</div>
    <div class="div3">Div 3</div>
    <div class="div4">Div 4 — clear: left</div>
  </section>
</body>
</html>
