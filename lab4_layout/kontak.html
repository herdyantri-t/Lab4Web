<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontak - Layout Sederhana</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="container">
  <header><h1>Kontak</h1></header>
  <nav aria-label="Navigasi utama">
    <a href="home.html">Home</a><a href="artikel.html">Artikel</a>
    <a href="about.html">About</a><a class="active" href="kontak.html">Kontak</a>
  </nav>
  <section id="hero">
    <h1>Hubungi Saya</h1>
    <p>Silakan isi formulir berikut untuk mengirim pesan.</p>
  </section>
  <section id="wrapper" class="single-column">
    <main id="main">
      <form class="contact-form" action="#" method="post">
        <label for="nama">Nama</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="nama@email.com" required>
        <label for="subjek">Subjek</label>
        <input type="text" id="subjek" name="subjek" placeholder="Subjek pesan">
        <label for="message">Pesan</label>
        <textarea id="message" name="message" rows="6" placeholder="Tulis pesan di sini..." required></textarea>
        <button type="submit" class="btn btn-large">Kirim Pesan</button>
        <p class="form-note">Catatan: formulir ini masih berupa tampilan HTML dan belum terhubung ke server untuk mengirim pesan.</p>
      </form>
    </main>
  </section>
  <footer><p>&copy; 2026 - Lab4Web | Praktikum Pemrograman Web</p></footer>
</div>
</body>
</html>
